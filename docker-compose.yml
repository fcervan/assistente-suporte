services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: suporte-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  docling:
    build: ../docling-service
    container_name: suporte-docling
    profiles: ["docling"]
    ports:
      - "8003:8000"
    environment:
      - DOCLING_API_KEYS=${DOCLING_API_KEYS:-}
      - DOCLING_MAX_UPLOAD_MB=${DOCLING_MAX_UPLOAD_MB:-50}
      - DOCLING_CONVERT_TIMEOUT=${DOCLING_CONVERT_TIMEOUT:-300}
      - DOCLING_RATE_LIMIT_PER_MINUTE=${DOCLING_RATE_LIMIT_PER_MINUTE:-60}
      - DOCLING_MAX_WORKERS=${DOCLING_MAX_WORKERS:-2}
      - DOCLING_DOCS_ENABLED=${DOCLING_DOCS_ENABLED:-1}
    restart: unless-stopped

  api:
    build: ./api
    container_name: suporte-api
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DUCKDB_PATH=/app/data/duckdb/tickets.duckdb
      - DOCLING_URL=${DOCLING_URL:-http://docling:8000}
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

  web:
    build: ./web
    container_name: suporte-web
    ports:
      - "5175:80"
    depends_on:
      - api
    restart: unless-stopped

  # FUTURO (v2, se escrita concorrente estourar o DuckDB):

  #     - POSTGRES_DB=suporte
  #     - POSTGRES_USER=suporte
  #     - POSTGRES_PASSWORD=suporte
  #   volumes: [pgdata:/var/lib/postgresql/data]

volumes:
  qdrant_storage:
